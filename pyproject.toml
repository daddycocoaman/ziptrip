[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ziptrip"
version = "0.1.0"
description = "Build Python zipapps for other platforms using Rust-style targets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "rich>=13.9,<15",
  "typer>=0.15,<1",
  "uv>=0.9,<0.13",
]

[project.scripts]
ziptrip = "ziptrip.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9", "build>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/ziptrip"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
